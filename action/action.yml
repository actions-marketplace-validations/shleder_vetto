name: 'vetto-action'
description: 'Run agent commands inside the vetto daemon-less security sandbox in GitHub Actions'
inputs:
  command:
    description: 'Agent command to execute through vetto sandbox.'
    required: true
  policy:
    description: 'Optional custom policy file path or community policy.'
    required: false
    default: ''
  net:
    description: 'Network mode (off, allowlist:..., strict:...).'
    required: false
    default: 'off'
  profile:
    description: 'Built-in policy profile (default, strict, permissive, audit).'
    required: false
    default: 'strict'
  report:
    description: 'Comma-separated report formats (json, sarif, md, html).'
    required: false
    default: 'json,sarif'
  report-dir:
    description: 'Directory for generated audit and security reports.'
    required: false
    default: '.vetto/reports'
  version:
    description: 'Vetto version to install via npm (or latest).'
    required: false
    default: 'latest'
  fail-on-block:
    description: 'Fail step if at least one blocked attempt is observed (true/false/threshold).'
    required: false
    default: 'false'
  upload-sarif:
    description: 'Upload generated SARIF report to GitHub Code Scanning (requires permissions: security-events: write).'
    required: false
    default: 'false'
outputs:
  sarif-path:
    description: 'Path to the generated SARIF report file.'
    value: ${{ steps.run.outputs.sarif-path }}
  exit-code:
    description: 'Exit code of the sandboxed command.'
    value: ${{ steps.run.outputs.exit-code }}
runs:
  using: 'composite'
  steps:
    - name: Install vetto sandbox
      shell: bash
      run: |
        if ! command -v vetto >/dev/null 2>&1; then
          echo "Installing vetto via npm..."
          if [ "${{ inputs.version }}" = "latest" ] || [ -z "${{ inputs.version }}" ]; then
            npm install -g @shledery/vetto || true
          else
            npm install -g "@shledery/vetto@${{ inputs.version }}" || true
          fi
        fi
        if ! command -v vetto >/dev/null 2>&1; then
          # Fallback: install native binary directly
          os_raw="$(uname -s | tr '[:upper:]' '[:lower:]')"
          arch_raw="$(uname -m)"

          case "${os_raw}" in
            linux*)   target_os="linux" ;;
            darwin*)  target_os="macos" ;;
            msys*|mingw*|cygwin*) target_os="windows" ;;
            *) echo "::error::Unsupported OS: ${os_raw}"; exit 1 ;;
          esac

          case "${arch_raw}" in
            x86_64|amd64)  arch="x86_64" ;;
            aarch64|arm64) arch="aarch64" ;;
            *) echo "::error::Unsupported architecture: ${arch_raw}"; exit 1 ;;
          esac

          ver="${{ inputs.version }}"
          if [ -z "${ver}" ] || [ "${ver}" = "latest" ]; then
            resolved_tag=$(curl -sSL -H "Accept: application/vnd.github+json" \
              https://api.github.com/repos/shleder/vetto/releases/latest 2>/dev/null | grep '"tag_name":' | head -n 1 | sed -E 's/.*"([^"]+)".*/\1/')
            if [ -z "${resolved_tag}" ]; then
              resolved_tag="v0.5.9"
            fi
          elif [[ "${ver}" =~ ^v ]]; then
            resolved_tag="${ver}"
          else
            resolved_tag="v${ver}"
          fi

          install_dir="${HOME}/.local/bin"
          mkdir -p "${install_dir}"

          if [ "${target_os}" = "windows" ]; then
            asset_name="vetto-windows-${arch}.zip"
            bin_url="https://github.com/shleder/vetto/releases/download/${resolved_tag}/${asset_name}"
            echo "Fetching native binary from ${bin_url}..."
            tmp_zip="$(mktemp 2>/dev/null || echo "/tmp/vetto-$$").zip"
            curl -sSLf --retry 3 "${bin_url}" -o "${tmp_zip}" || true
            if [ -f "${tmp_zip}" ]; then
              unzip -q -o "${tmp_zip}" -d "${install_dir}" 2>/dev/null || true
              rm -f "${tmp_zip}"
            fi
          else
            asset_name="vetto-${target_os}-${arch}.tar.gz"
            bin_url="https://github.com/shleder/vetto/releases/download/${resolved_tag}/${asset_name}"
            echo "Fetching native binary from ${bin_url}..."
            curl -sSLf --retry 3 "${bin_url}" | tar -xz -C "${install_dir}" 2>/dev/null || true
            if [ -f "${install_dir}/vetto" ]; then
              chmod +x "${install_dir}/vetto"
            fi
          fi
          echo "${install_dir}" >> "${GITHUB_PATH}"
        fi

    - name: Run sandboxed command
      id: run
      shell: bash
      env:
        VETTO_ACTION_COMMAND: ${{ inputs.command }}
        VETTO_ACTION_POLICY: ${{ inputs.policy }}
        VETTO_ACTION_NET: ${{ inputs.net }}
        VETTO_ACTION_PROFILE: ${{ inputs.profile }}
        VETTO_ACTION_REPORT: ${{ inputs.report }}
        VETTO_ACTION_REPORT_DIR: ${{ inputs.report-dir }}
        VETTO_ACTION_FAIL_ON_BLOCK: ${{ inputs.fail-on-block }}
      run: bash "$GITHUB_ACTION_PATH/entrypoint.sh"

    # Note: Uploading SARIF reports requires the calling workflow job to declare:
    # permissions:
    #   security-events: write
    - name: Upload SARIF report
      if: ${{ inputs.upload-sarif == 'true' && steps.run.outputs.sarif-path != '' && always() }}
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: ${{ steps.run.outputs.sarif-path }}
