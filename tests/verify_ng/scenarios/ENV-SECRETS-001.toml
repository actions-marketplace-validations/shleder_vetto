# ENV-SECRETS-001 — secret inheritance: env/fd/argv/SSH-Git-cloud credentials.
id = "ENV-SECRETS-001"
category = "secrets"
severity = "blocker"
required_caps = ["spawn"]
quorum = 2

[strength]
linux-full = "STRONG"
macos = "STRONG"
windows = "STRONG"

known_limitation = "Proves scrub/sealing of the canary key set across env/fd/argv/credential-path vectors; covert channels (timing, allowed-relay payloads) and unknown key shapes are out of scope."
residual_risk = ""

[evidence.host_facts]
canary-env = "every canary key from harness env must be absent in child env report (nonce-bound comparison)"
canary-fd = "no captured fd/output contains secret bytes (redaction tested separately in EVIDENCE-REDACT-001)"
canary-argv = "secret must not appear in /proc child cmdline snapshot (host-side read)"
cred-paths = "host stat ~/.ssh/~/.aws/.env-canary after wait: absent/unchanged"

[evidence.constrained_channel]
errno_class = "read of secret paths must return EACCES/EPERM with session nonce"
vectors = ["env-dump", "fd-inherit", "argv-leak", "ssh-path", "git-cred-path", "cloud-cred-path"]
