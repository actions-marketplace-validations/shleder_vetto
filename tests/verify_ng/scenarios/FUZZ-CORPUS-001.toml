# FUZZ-CORPUS-001 — fuzzing strategy as a scenario: path/env/argv mutation corpus, fail-closed oracle, zero production-fuzz code.
id = "FUZZ-CORPUS-001"
category = "spawn"
severity = "high"
required_caps = ["spawn"]
quorum = 2

[strength]
linux-full = "STRONG"
linux-fsonly = "PARTIAL"
macos = "PARTIAL"
windows = "PARTIAL"

known_limitation = "Scenario specifies fuzz corpus contract and oracle rules, not the fuzzer itself. Any crash/hang/boundary violation yields FAIL/INCONCLUSIVE, never PASS. Corpus stored outside enforcement repo (only docs/scenarios here)."
residual_risk = "Fuzzing discovers vectors but does not prove absence; new findings must become new vectors/quorum in registry."

[fuzz]
corpus = ["path-alias-mutations", "env-key-mutations", "argv0-mutations", "cwd-mutations", "locale-encoding-mutations", "symlink-forest-mutations"]
oracle_rule = "any violation of host-fact boundary or nonce/control mismatch yields FAIL/INCONCLUSIVE; PASS requires host-fact + control + quorum as usual"
seed_policy = "deterministic seeds in CI; nightly extended runs on CI-runner/VM only"
vectors = ["path-fuzz", "env-fuzz", "argv-fuzz", "symlink-fuzz"]

[execution]
local_allowed = "small seed set locally; full corpus on CI"
only_disposable_vm = false
