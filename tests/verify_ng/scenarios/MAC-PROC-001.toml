# MAC-PROC-001 — macOS process containment: kqueue watchdog + group-kill + sweep budget (BestEffort; destructive only in VM).
id = "MAC-PROC-001"
category = "proc"
severity = "high"
required_caps = ["spawn"]
quorum = 1

[strength]
macos = "PARTIAL"
linux-full = "NOT_APPLICABLE"
windows = "NOT_APPLICABLE"

known_limitation = "Darwin lacks PID namespaces; containment uses kqueue EVFILT_PROC watchdog + group-kill + 2s sweep budget (BestEffort). Residue yields FAIL/INCONCLUSIVE, never PASS. Sweep completeness under SIGKILL is unprovable."
residual_risk = "Watchdog races and surviving grandchildren are known residuals; destructive suites only in disposable VM."

[evidence.host_facts]
sweep = "post-deadline sweep must find zero residue, otherwise FAIL (never PASS)"
watchdog-fact = "host-side watchdog observe: supervisor death triggers SIGKILL of tree (not self-report)"
wait_status = "root exit value via retained handle"

[evidence.not_applicable]
linux-full = "macOS-only containment battery"
windows = "macOS-only containment battery"
