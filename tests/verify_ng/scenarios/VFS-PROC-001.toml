# VFS-PROC-001 — access via /proc, /sys, device nodes, and fd injections.
id = "VFS-PROC-001"
category = "fs-read"
severity = "blocker"
required_caps = ["spawn", "landlock"]
quorum = 2

[strength]
linux-full = "STRONG"
linux-fsonly = "PARTIAL"
macos = "PARTIAL"
windows = "PARTIAL"

known_limitation = "Covers /proc/self/{mem,fd,cwd,root,exe}, /proc/<pid>/fd leaks, /sys and /dev bypasses present in payload set; new kernel interfaces require new vectors."
residual_risk = "On fs-only and macOS, portions of OS surfaces are visible wider than in PIDns/full; strength ceiling PARTIAL there. Windows: \\Device\\ and drive-alias coverage is advisory."

[evidence.host_facts]
postmortem = "host stat/canary comparison of canary target after wait: absence/immutability means held"
proc-leak = "no foreign fd/mem/cwd/root path must yield canary bytes (host-side comparison)"

[evidence.constrained_channel]
errno_class = "open/read via /proc|/sys|/dev aliases must return EACCES/EPERM/ENOENT with session nonce"
vectors = ["proc-self-mem", "proc-self-fd", "proc-pid-fd", "sys-alias", "dev-alias", "fd-reopen-O_PATH"]
