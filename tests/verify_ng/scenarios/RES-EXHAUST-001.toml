# RES-EXHAUST-001 — resource exhaustion: fork-bomb/pids, IO, disk, memory (adversarial).
id = "RES-EXHAUST-001"
category = "proc"
severity = "high"
required_caps = ["spawn", "tree-sweep"]
quorum = 2

[strength]
linux-full = "STRONG"
windows = "STRONG"
linux-fsonly = "PARTIAL"
macos = "PARTIAL"

known_limitation = "Proves bounded exhaustion handling (limits + kill + sweep) for covered shapes; full host-wide DoS immunity not proven. Run only in disposable VM/CI-runner with quotas."
residual_risk = "On fs-only/macOS, part of limits are best-effort; excess yields FAIL/INCONCLUSIVE, never PASS. Locally without quotas: smoke variant only."

[evidence.host_facts]
tree_sweep = "external sweep after terminate must find zero residual processes"
host-quota = "host quotas (pids/io/disk) not exceeded outside session; cgroup/Job counters nominal"
wait_status = "root exit value gathered via retained handle, not self-report"

[evidence.constrained_channel]
errno_class = "fork/clone beyond limit must return EAGAIN with session nonce"
vectors = ["fork-bomb", "pids-limit", "io-flood", "disk-fill", "mem-pressure"]

[execution]
only_disposable_vm = true
local_allowed = "smoke variant with small quotas; full variant on CI-runner/VM only"
