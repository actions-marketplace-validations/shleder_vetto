# SEC-BLOCKS-001 — seccomp/syscall denial: ptrace/process_vm/pidfd, mount/pivot, io_uring, userfaultfd, bpf/perf (Linux suite, native ABI).
id = "SEC-BLOCKS-001"
category = "spawn"
severity = "blocker"
required_caps = ["spawn"]
quorum = 2

[strength]
linux-full = "STRONG"
linux-seccomp = "STRONG"
linux-fsonly = "PARTIAL"
macos = "NOT_APPLICABLE"
windows = "NOT_APPLICABLE"

known_limitation = "Proves denial of enumerated dangerous syscall surface via native ABI (numbers from libc::SYS_*, no x86-64 constants on ARM64); filter completeness against 0-day not proven. macOS/Windows: NOT_APPLICABLE only with probe proof of absent capability."
residual_risk = "On linux-fsonly, portion of surface is best-effort; divergence yields INCONCLUSIVE."

[evidence.host_facts]
wait_status = "root exit value gathered via retained handle; no denied syscall returned success"
audit-tap = "host-side audit/seccomp-tap (advisory) shows no successful denied syscalls; missing tap does not yield PASS"

[evidence.constrained_channel]
errno_class = "denied syscalls must return EPERM/ENOSYS with session nonce"
vectors = ["ptrace", "process_vm_readv-writev", "pidfd_getfd", "mount-pivot-umount", "io_uring", "userfaultfd", "bpf-perf"]

[evidence.not_applicable]
macos = "Darwin does not have seccomp-bpf; requires probe evidence of missing capability, otherwise N/A-without-absence-evidence blocks gate"
windows = "Windows does not have seccomp-bpf; requires probe evidence of missing capability, otherwise N/A-without-absence-evidence blocks gate"
