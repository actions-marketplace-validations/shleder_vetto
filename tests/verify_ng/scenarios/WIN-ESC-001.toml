# WIN-ESC-001 — Windows escape battery: PowerShell/cmd/API, restricted token, integrity, Job, ACL, network (host-fact-only).
id = "WIN-ESC-001"
category = "proc"
severity = "blocker"
required_caps = ["spawn", "tree-sweep"]
quorum = 2

[strength]
windows = "STRONG"
windows-sandbox-vm = "STRONG"
linux-full = "NOT_APPLICABLE"
linux-fsonly = "NOT_APPLICABLE"
linux-seccomp = "NOT_APPLICABLE"
macos = "NOT_APPLICABLE"

known_limitation = "Windows evidence is host-fact-only until HANDLE-capture in backend (requires separate backend review, outside verify-ng). Per-domain egress without admin is UNPROVABLE (WFP requires elevation). WSL interop: see WIN-WSL-001 (UNSUPPORTED)."
residual_risk = "UNC/mapped-drive aliases: see WIN-UNC-001 (PARTIAL/advisory). WFP allowlist without admin is unprovable and must fail-closed."

[evidence.host_facts]
job-sweep = "Job Object kill-on-close: external host observe after close must find zero residual processes"
token-fact = "host-side token/integrity snapshot: Low integrity + restricted token held (not process self-report)"
acl-postmortem = "host stat of external targets after wait: absent/unchanged"
no-pipe-collection = "Windows evidence is collected via host facts; pipe-drain stub returns not-EOF yielding INCONCLUSIVE, never PASS"

[evidence.constrained_channel]
errno_class = "denied accesses must return ACCESS_DENIED with session nonce (narrow hint; verdict based on host facts only)"
vectors = ["powershell-escape", "cmd-escape", "winapi-direct", "unc-alias", "mapped-drive", "wsl-interop-probe", "token-escape", "job-escape", "acl-bypass"]

[evidence.not_applicable]
linux-full = "Windows-only battery; on Linux requires probe proof of missing Windows capability"
macos = "Windows-only battery; on macOS requires probe proof of missing Windows capability"
