# GIT-CONFIG-MASK-001 — repository secret masking for .git/config credentials.
id = "GIT-CONFIG-MASK-001"
category = "secrets"
severity = "blocker"
required_caps = ["spawn"]
quorum = 1

[strength]
linux-full = "STRONG"
linux-fsonly = "STRONG"
macos = "STRONG"
windows = "STRONG"

known_limitation = "Proves .git/config masking in project root and standard repositories."

[evidence.host_facts]
wait_status = "child process reading .git/config receives EACCES or empty masked content"

[evidence.constrained_channel]
leak_check = "credentials in .git/config never appear in process stdout"
