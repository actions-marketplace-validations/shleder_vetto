# WIN-NET-001 — Windows egress: --net=off via AppContainer capabilities (host-fact-only); per-domain without admin UNPROVABLE/fail-closed.
id = "WIN-NET-001"
category = "net"
severity = "blocker"
required_caps = ["spawn"]
quorum = 2

[strength]
windows = "PARTIAL"
windows-sandbox-vm = "STRONG"
linux-full = "NOT_APPLICABLE"
macos = "NOT_APPLICABLE"

known_limitation = "Per-domain egress without admin on Windows is UNPROVABLE (WFP requires elevation); allowlist must fail-closed in AppContainer capability deny, never silent allow. Full Strong only via windows-sandbox-vm."
residual_risk = "On native Windows, only capability deny is proven, not absence of route; strength ceiling PARTIAL. Any per-domain PASS without admin is an oracle bug."

[evidence.host_facts]
listener-v4 = "host loopback listener (IPv4) stays unconnected for the whole run"
listener-v6 = "host loopback listener (IPv6) stays unconnected for the whole run"
no-wfp-claim = "report must carry marker of missing admin; per-domain claims without elevation forbidden"

[evidence.constrained_channel]
errno_class = "connect/sendto/getaddrinfo must return ACCESS_DENIED/WSAENETUNREACH/timeout with session nonce (hint; verdict on host facts)"
vectors = ["curl", "powershell-net", "python-socket", "native-tcp4", "native-tcp6", "dns", "alt-http-client"]

[evidence.not_applicable]
linux-full = "Windows-only egress battery"
macos = "Windows-only egress battery"
