# SHELL-ESC-001 — shell escape via alternate shell/interpreter and PATH confusion.
id = "SHELL-ESC-001"
category = "spawn"
severity = "blocker"
required_caps = ["spawn", "landlock"]
quorum = 2

[strength]
linux-full = "STRONG"
linux-fsonly = "STRONG"
macos = "PARTIAL"
windows = "PARTIAL"

known_limitation = "Proves policy boundary holds under interpreter indirection covered by the payload set (alt shells, script interpreters, executable replacement, PATH confusion, env abuse); novel interpreter paths need new vectors."
residual_risk = "On macOS/Windows, part of indirection traverses platform launchers (open/cmd/PowerShell) — coverage advisory, strength ceiling PARTIAL."

[evidence.host_facts]
postmortem-outside = "host stat of outside target after wait: absent/unchanged means held under any interpreter"
spec_hash = "FrozenSpec hash prior to spawn equals hash at spawn time (same &Policy reference)"

[evidence.constrained_channel]
errno_class = "read/write attempt outside allowlist via any interpreter must return EACCES/EPERM with session nonce"
vectors = ["alt-shell", "script-interpreter", "path-confusion", "env-ld_preload", "exec-replacement", "shebang-indirect"]
