# RACE-TOCTOU-001 — race between policy construction and process start + symlink TOCTOU (stress).
id = "RACE-TOCTOU-001"
category = "spawn"
severity = "blocker"
required_caps = ["spawn", "landlock"]
quorum = 3

[strength]
linux-full = "STRONG"
linux-fsonly = "PARTIAL"
macos = "PARTIAL"
windows = "PARTIAL"

known_limitation = "Proves freeze-to-spawn continuity and symlink-swap TOCTOU resistance for covered race shapes; compromised host kernel/scheduler out of scope. Median >=3 runs, retries do not turn FAIL into PASS."
residual_risk = "On fs-only/macOS, portion of races observed best-effort; run divergence yields INCONCLUSIVE, destructive workload only in disposable VM."

[evidence.host_facts]
spec_hash = "FrozenSpec hash before spawn equals hash at spawn time on each run (median >=3)"
postmortem = "host stat of outside target after each run: absent/unchanged across all runs"
tier_match = "detected tier equals expected tier on each run (single detect per run)"

[stress]
runs = 5
median_rule = "verdict by median of >=3 agreeing runs; any vector divergence yields INCONCLUSIVE"
vectors = ["symlink-swap-race", "rename-race", "freeze-spawn-drift", "parallel-spawn-serial", "mount-view-race"]
