[metadata]
name = "command_code"
description = "Compatibility profile for Command Code autonomous coding loop (#8 Token Leaderboard)."

[filesystem]
allow_read = [
    "$AGENT",
    "$HOME/.command-code",
    "$HOME/.config/command-code",
    "$HOME/.cache/command-code",
    "$HOME/.local/bin",
    "$HOME/.cargo/bin",
    "/tmp",
    "$HOME/.cache",
    "$HOME/.cache/ms-playwright",
    "$HOME/.cache/puppeteer",
    "$HOME/.npm",
    "$HOME/.npm/_npx",
    "$HOME/.cache/uv",
    "$HOME/.local/share/uv",
    "$HOME/.bun",
    "$HOME/.bun/install/cache",
]
allow_write = [
    "$AGENT",
    "$HOME/.command-code",
    "$HOME/.config/command-code",
    "$HOME/.cache/command-code",
    "/tmp",
    "$HOME/.cache",
    "$HOME/.cache/ms-playwright",
    "$HOME/.cache/puppeteer",
    "$HOME/.npm",
    "$HOME/.npm/_npx",
    "$HOME/.cache/uv",
    "$HOME/.local/share/uv",
    "$HOME/.bun",
    "$HOME/.bun/install/cache",
]

[environment]
pass_through = [
    "COMMAND_CODE_*",
    "COHERE_API_KEY",
    "OPENAI_API_KEY",
    "ANTHROPIC_API_KEY",
    "OPENROUTER_API_KEY",
    "DISPLAY",
    "WAYLAND_DISPLAY",
    "XDG_CURRENT_DESKTOP",
    "XDG_SESSION_TYPE",
    "XDG_SESSION_DESKTOP",
    "XAUTHORITY",
    "DBUS_SESSION_BUS_ADDRESS",
    "BROWSER",
    "XDG_RUNTIME_DIR",
]

[network]
allow = [
    "api.cohere.com",
    "api.cohere.ai",
    "api.openai.com",
    "api.anthropic.com",
    "openrouter.ai",
    "registry.npmjs.org",
    "pypi.org",
    "files.pythonhosted.org",
]
