[metadata]
name = "hermes"
description = "Compatibility profile for Hermes Agent autonomous runtime (#1 Token Leaderboard)."

[filesystem]
allow_read = [
    "$AGENT",
    "$HOME/.hermes",
    "$HOME/.config/hermes",
    "$HOME/.cache/hermes",
    "$HOME/.local/bin",
    "$HOME/.cargo/bin",
    "/tmp",
    "$HOME/.cache",
    "$HOME/.cache/ms-playwright",
    "$HOME/.cache/puppeteer",
    "$HOME/.npm",
    "$HOME/.npm/_npx",
    "$HOME/.cache/uv",
    "$HOME/.local/share/uv",
    "$HOME/.bun",
    "$HOME/.bun/install/cache",
]
allow_write = [
    "$AGENT",
    "$HOME/.hermes",
    "$HOME/.config/hermes",
    "$HOME/.cache/hermes",
    "/tmp",
    "$HOME/.cache",
    "$HOME/.cache/ms-playwright",
    "$HOME/.cache/puppeteer",
    "$HOME/.npm",
    "$HOME/.npm/_npx",
    "$HOME/.cache/uv",
    "$HOME/.local/share/uv",
    "$HOME/.bun",
    "$HOME/.bun/install/cache",
]

[environment]
pass_through = [
    "HERMES_*",
    "NOUS_*",
    "OPENAI_API_KEY",
    "ANTHROPIC_API_KEY",
    "OPENROUTER_API_KEY",
    "TOGETHER_API_KEY",
    "DISPLAY",
    "WAYLAND_DISPLAY",
    "XDG_CURRENT_DESKTOP",
    "XDG_SESSION_TYPE",
    "XDG_SESSION_DESKTOP",
    "XAUTHORITY",
    "DBUS_SESSION_BUS_ADDRESS",
    "BROWSER",
    "XDG_RUNTIME_DIR",
]

[network]
allow = [
    "api.openai.com",
    "api.anthropic.com",
    "openrouter.ai",
    "nousresearch.com",
    "api.together.xyz",
    "registry.npmjs.org",
    "pypi.org",
    "files.pythonhosted.org",
]
