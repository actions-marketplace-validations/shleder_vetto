[metadata]
name = "autogen"
description = "Compatibility profile for Microsoft AutoGen multi-agent framework."

[filesystem]
allow_read = [
    "$AGENT",
    "$HOME/.autogen",
    "$HOME/.autogenstudio",
    "$HOME/.config/autogen",
    "$HOME/.cache/autogen",
    "$HOME/.local/bin",
    "$HOME/.cargo/bin",
    "/tmp",
    "$HOME/.cache",
    "$HOME/.cache/ms-playwright",
    "$HOME/.cache/puppeteer",
    "$HOME/.npm",
    "$HOME/.npm/_npx",
    "$HOME/.cache/uv",
    "$HOME/.local/share/uv",
    "$HOME/.bun",
    "$HOME/.bun/install/cache",
]
allow_write = [
    "$AGENT",
    "$HOME/.autogen",
    "$HOME/.autogenstudio",
    "$HOME/.config/autogen",
    "$HOME/.cache/autogen",
    "/tmp",
    "$HOME/.cache",
    "$HOME/.cache/ms-playwright",
    "$HOME/.cache/puppeteer",
    "$HOME/.npm",
    "$HOME/.npm/_npx",
    "$HOME/.cache/uv",
    "$HOME/.local/share/uv",
    "$HOME/.bun",
    "$HOME/.bun/install/cache",
]

[environment]
pass_through = [
    "AUTOGEN_*",
    "OPENAI_API_KEY",
    "ANTHROPIC_API_KEY",
    "GEMINI_API_KEY",
    "AZURE_OPENAI_API_KEY",
    "AZURE_OPENAI_ENDPOINT",
    "GROQ_API_KEY",
    "COHERE_API_KEY",
    "MISTRAL_API_KEY",
    "TOGETHER_API_KEY",
    "OLLAMA_HOST",
    "DISPLAY",
    "WAYLAND_DISPLAY",
    "XDG_CURRENT_DESKTOP",
    "XDG_SESSION_TYPE",
    "XDG_SESSION_DESKTOP",
    "XAUTHORITY",
    "DBUS_SESSION_BUS_ADDRESS",
    "BROWSER",
    "XDG_RUNTIME_DIR",
]

[network]
mode = "allowlist"
allow = [
    "api.openai.com",
    "api.anthropic.com",
    "generativelanguage.googleapis.com",
    "api.groq.com",
    "openrouter.ai",
    "api.mistral.ai",
    "api.together.xyz",
    "api.cohere.com",
    "api.cohere.ai",
    "github.com",
    "api.github.com",
    "registry.npmjs.org",
    "pypi.org",
    "files.pythonhosted.org",
]
