[metadata]
name = "aider"
description = "Hardened compatibility roots for Aider pair programmer."

[security]
git_guard = true
auto_deny_secrets = true

[filesystem]
allow_read = [
    "$HOME/.aider.conf.yml",
    "$AGENT",
    "$HOME/.aider/plugins",
    "$HOME/.aider/skills",
    "$HOME/.config/aider",
    "$PROJECT/.aider.chat.history.md",
    "$PROJECT/.aider.input.history",
    "$PROJECT/.aider.tags.cache.v3",
    "$HOME/.local/bin",
    "$HOME/.cargo/bin",
    "/tmp",
    "$HOME/.cache",
    "$HOME/.cache/ms-playwright",
    "$HOME/.cache/puppeteer",
    "$HOME/.npm",
    "$HOME/.npm/_npx",
    "$HOME/.cache/uv",
    "$HOME/.local/share/uv",
    "$HOME/.bun",
    "$HOME/.bun/install/cache",
]
allow_write = [
    "$HOME/.aider.conf.yml",
    "$AGENT",
    "$HOME/.aider/plugins",
    "$HOME/.aider/skills",
    "$HOME/.config/aider",
    "$PROJECT/.aider.chat.history.md",
    "$PROJECT/.aider.input.history",
    "$PROJECT/.aider.tags.cache.v3",
    "/tmp",
    "$HOME/.cache",
    "$HOME/.cache/ms-playwright",
    "$HOME/.cache/puppeteer",
    "$HOME/.npm",
    "$HOME/.npm/_npx",
    "$HOME/.cache/uv",
    "$HOME/.local/share/uv",
    "$HOME/.bun",
    "$HOME/.bun/install/cache",
]

[environment]
pass_through = [
    "AIDER_*",
    "OPENAI_API_KEY",
    "OPENAI_BASE_URL",
    "ANTHROPIC_API_KEY",
    "ANTHROPIC_BASE_URL",
    "OPENROUTER_API_KEY",
    "OPENROUTER_BASE_URL",
    "GEMINI_API_KEY",
    "DEEPSEEK_API_KEY",
    "DEEPSEEK_BASE_URL",
    "GROQ_API_KEY",
    "GROQ_BASE_URL",
    "MISTRAL_API_KEY",
    "MISTRAL_BASE_URL",
    "COHERE_API_KEY",
    "COHERE_BASE_URL",
    "TOGETHER_API_KEY",
    "PERPLEXITY_API_KEY",
    "OLLAMA_API_BASE",
    "DISPLAY",
    "WAYLAND_DISPLAY",
    "XDG_CURRENT_DESKTOP",
    "XDG_SESSION_TYPE",
    "XDG_SESSION_DESKTOP",
    "XAUTHORITY",
    "DBUS_SESSION_BUS_ADDRESS",
    "BROWSER",
    "XDG_RUNTIME_DIR",
]

[network]
allow = [
    "api.openai.com",
    "api.anthropic.com",
    "auth.anthropic.com",
    "openrouter.ai",
    "api.deepseek.com",
    "api.groq.com",
    "generativelanguage.googleapis.com",
    "api.mistral.ai",
    "api.cohere.ai",
    "api.cohere.com",
    "api.together.xyz",
    "api.perplexity.ai",
    "aider.chat",
    "api.github.com",
    "github.com",
    "registry.npmjs.org",
    "pypi.org",
    "files.pythonhosted.org",
]

