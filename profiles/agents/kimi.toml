[metadata]
name = "kimi"
description = "Hardened compatibility roots for Kimi Code CLI (Moonshot AI)."

[filesystem]
allow_read = [
    "$AGENT",
    "$HOME/.kimi",
    "$HOME/.config/kimi",
    "$HOME/.local/bin",
    "$HOME/.cargo/bin",
    "/tmp",
    "$HOME/.cache",
    "$HOME/.cache/ms-playwright",
    "$HOME/.cache/puppeteer",
    "$HOME/.npm",
    "$HOME/.npm/_npx",
    "$HOME/.cache/uv",
    "$HOME/.local/share/uv",
    "$HOME/.bun",
    "$HOME/.bun/install/cache",
]
allow_write = [
    "$AGENT",
    "$HOME/.kimi",
    "$HOME/.config/kimi",
    "/tmp",
    "$HOME/.cache",
    "$HOME/.cache/ms-playwright",
    "$HOME/.cache/puppeteer",
    "$HOME/.npm",
    "$HOME/.npm/_npx",
    "$HOME/.cache/uv",
    "$HOME/.local/share/uv",
    "$HOME/.bun",
    "$HOME/.bun/install/cache",
]

[environment]
pass_through = [
    "KIMI_*",
    "MOONSHOT_API_KEY",
    "MOONSHOT_BASE_URL",
    "DISPLAY",
    "WAYLAND_DISPLAY",
    "XDG_CURRENT_DESKTOP",
    "XDG_SESSION_TYPE",
    "XDG_SESSION_DESKTOP",
    "XAUTHORITY",
    "DBUS_SESSION_BUS_ADDRESS",
    "BROWSER",
    "XDG_RUNTIME_DIR",
]

[network]
allow = [
    "code.kimi.com",
    "api.moonshot.cn",
    "api.moonshot.ai",
    "registry.npmjs.org",
    "pypi.org",
    "files.pythonhosted.org",
]
